name: astrbot_plugin_global_model_switcher
display_name: 全局模型切换器
short_desc: 在聊天中查看并动态热切换 AstrBot 全局默认 LLM Provider
desc: |
  AstrBot 全局默认 LLM Provider 动态切换插件。
  
  核心特性：
  - /gmls：列出已启用的 LLM Provider 及其模型，标注当前全局生效项。
  - /gmsw <序号或ID>：支持通过序号或 Provider ID 切换全局默认模型，即时生效并持久化。
  - 安全回滚：内置异常捕获与配置回滚机制，持久化失败自动还原配置。
  - 权限隔离：仅管理员有权执行查看与切换操作。
version: 1.0.0
author: xixi
repo: https://github.com/xixil/astrbot_plugin_global_model_switcher
astrbot_version: ">=4.5.0"
tags:
  - llm
  - admin
  - switcher
  - provider
