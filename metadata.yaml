name: astrbot_plugin_global_model_switcher
display_name: 全局模型切换器
short_desc: 在聊天中查看并切换 AstrBot 全局默认 LLM Provider
desc: |
  AstrBot 全局默认 LLM Provider 切换插件。

  核心特性：
  - /gmls：列出已启用的 LLM Provider 及其模型，标出当前全局默认项。
  - /gmsw <序号或ID>：按序号或 Provider ID 切换全局默认 Provider，写入配置文件。
  - 失败回滚：保存失败时按快照还原配置，回滚后的保存仍失败会在回复中说明。
  - 权限：仅管理员可用。
version: 1.0.7
author: 柒梦染星河
repo: https://github.com/xixil/astrbot_plugin_global_model_switcher
astrbot_version: ">=4.5.0"
tags:
